<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>清单</title>
<style>
  :root {
    --bg: #faf8fd; --card: #ffffff; --line: #e6e0ee;
    --text: #1d1b20; --muted: #79747e; --accent: #6750a4; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141218; --card: #211f26; --line: #332f3a;
      --text: #e6e0e9; --muted: #938f99; --accent: #d0bcff; --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .view { display: none; }
  .view.on { display: block; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px 10px; position: sticky; top: 0;
    background: var(--bg); z-index: 2;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; }
  .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  button {
    font: inherit; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #fff; padding: 7px 13px;
  }
  button.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
  button.danger { background: transparent; color: var(--danger); }
  button:disabled { opacity: .4; }
  .section {
    font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 10px 14px 6px;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px; margin: 0 14px 8px;
  }
  .row .name { flex: 1; min-width: 0; }
  .row .name b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .count { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .badge {
    font-size: 10.5px; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 6px; padding: 1px 5px;
  }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; }
  .check {
    width: 20px; height: 20px; border-radius: 6px; flex: none;
    border: 1.5px solid var(--line); margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .item .txt { flex: 1; line-height: 1.45; word-break: break-word; }
  .item.done .txt { text-decoration: line-through; color: var(--muted); }
  .item .acts { display: flex; gap: 8px; flex: none; }
  .item .acts span { font-size: 11.5px; color: var(--accent); cursor: pointer; }
  .item .acts span.del { color: var(--danger); }
  .addRow { display: flex; gap: 8px; padding: 8px 14px 4px; }
  input {
    flex: 1; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; outline: 0;
  }
  .footer { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 14px; }
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.42);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 50;
  }
  .mask[hidden] { display: none; }
  .ask {
    background: var(--card); border-radius: 16px; padding: 18px;
    width: 100%; max-width: 320px;
  }
  .askTitle { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .ask input { width: 100%; }
  .askActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<!-- 清单库 -->
<div class="view on" id="shelf">
  <header>
    <h1>清单</h1>
    <button id="newList">新建</button>
  </header>
  <div class="section" id="tplTitle" hidden>模板</div>
  <div id="templates"></div>
  <div class="section">我的清单</div>
  <div id="lists"></div>
  <div class="empty" id="emptyShelf" hidden>
    <div style="line-height:1.7;margin-bottom:10px">
      还没有清单。清单就是一组勾选项 —— 打包、采购、搬家，都行。
    </div>
    <button class="ghost" id="seedShelf">载入示例：露营打包</button>
  </div>
</div>

<!-- 清单内页 -->
<div class="view" id="detail">
  <header>
    <button class="ghost" id="back">返回</button>
    <div style="flex:1;min-width:0">
      <h1 id="listName" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h1>
      <div class="sub" id="listProgress"></div>
    </div>
  </header>
  <div id="items"></div>
  <div class="empty" id="emptyItems" hidden>还没有条目，下面加一条。</div>
  <div class="addRow">
    <input id="itemInput" placeholder="加一条…" autocomplete="off">
    <button id="addItem" disabled>加</button>
  </div>
  <div class="footer">
    <button class="ghost" id="clearDone">清空已完成</button>
    <button class="ghost" id="saveTemplate">存为模板</button>
    <button class="danger" id="deleteList">删除清单</button>
  </div>
</div>

<div class="mask" id="askMask" hidden>
  <div class="ask">
    <div class="askTitle" id="askTitle"></div>
    <input id="askInput" autocomplete="off">
    <div class="askActions">
      <button class="ghost" id="askCancel">取消</button>
      <button id="askOk">确定</button>
    </div>
  </div>
</div>

<script>
(function () {
  var state = { view: 'shelf', lists: [], items: [], currentId: null, currentName: '' };

  var shelf = document.getElementById('shelf');
  var detail = document.getElementById('detail');
  var templatesBox = document.getElementById('templates');
  var listsBox = document.getElementById('lists');
  var itemsBox = document.getElementById('items');

  function whenHostReady(fn, tries) {
    tries = tries || 0;
    if (window.host) return fn();
    if (tries > 100) return;
    setTimeout(function () { whenHostReady(fn, tries + 1); }, 50);
  }

  function nowIso() { return new Date().toISOString(); }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function toast(text) {
    var box = document.getElementById('toast');
    if (!box) {
      box = el('div');
      box.id = 'toast';
      box.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
        'background:rgba(0,0,0,.82);color:#fff;font-size:12.5px;padding:8px 14px;' +
        'border-radius:20px;z-index:99;transition:opacity .2s;pointer-events:none';
      document.body.appendChild(box);
    }
    box.textContent = text;
    box.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { box.style.opacity = '0'; }, 1400);
  }

  /// 页面内的文本输入弹层。
  ///
  /// 不用 `window.prompt`：它会弹出 Android 原生灰色对话框，标题还是
  /// "The page at file:// says:"，和 App 的观感完全割裂（2026-11-16 模拟器实测）。
  function askText(title, defaultValue) {
    return new Promise(function (resolve) {
      var mask = document.getElementById('askMask');
      var input = document.getElementById('askInput');
      document.getElementById('askTitle').textContent = title;
      input.value = defaultValue || '';
      mask.hidden = false;
      input.focus();
      input.select();

      function done(ok) {
        mask.hidden = true;
        document.getElementById('askOk').onclick = null;
        document.getElementById('askCancel').onclick = null;
        input.onkeydown = null;
        resolve(ok ? input.value : null);
      }
      document.getElementById('askOk').onclick = function () { done(true); };
      document.getElementById('askCancel').onclick = function () { done(false); };
      input.onkeydown = function (event) {
        if (event.key === 'Enter') done(true);
        if (event.key === 'Escape') done(false);
      };
    });
  }

  // ---- 读 ----

  async function reloadLists() {
    state.lists = (await window.host.call('db.select', {
      table: 'lists',
      orderBy: [{ column: 'used_at', desc: true }, { column: 'id', desc: true }],
      limit: 200
    })) || [];
    renderShelf();
  }

  async function reloadItems() {
    if (state.currentId == null) { state.items = []; return; }
    state.items = (await window.host.call('db.select', {
      table: 'items',
      where: [{ column: 'list_id', value: state.currentId }],
      orderBy: [{ column: 'sort_order' }, { column: 'id' }],
      limit: 500
    })) || [];
    renderDetail();
  }

  // ---- 渲染 ----

  function renderShelf() {
    templatesBox.innerHTML = '';
    listsBox.innerHTML = '';

    var tpls = state.lists.filter(function (l) { return l.is_template; });
    var normal = state.lists.filter(function (l) { return !l.is_template; });

    document.getElementById('tplTitle').hidden = tpls.length === 0;
    tpls.forEach(function (l) { templatesBox.appendChild(shelfRow(l, true)); });
    normal.forEach(function (l) { listsBox.appendChild(shelfRow(l, false)); });

    document.getElementById('emptyShelf').hidden = state.lists.length !== 0;
  }

  function shelfRow(list, isTemplate) {
    var row = el('div', 'row');
    var nameBox = el('div', 'name');
    var title = el('b');

    title.appendChild(el('span', null, list.name));
    if (isTemplate) {
      var badge = el('span', 'badge', '模板');
      badge.style.marginLeft = '6px';
      title.appendChild(badge);
    }
    nameBox.appendChild(title);
    nameBox.appendChild(el('div', 'count', '点开查看'));
    row.appendChild(nameBox);
    row.onclick = function () { openList(list); };

    if (isTemplate) {
      var use = el('span', 'badge', '用这个新建');
      use.style.cursor = 'pointer';
      use.onclick = function (event) {
        event.stopPropagation();
        createFromTemplate(list);
      };
      row.appendChild(use);
    }
    return row;
  }

  function renderDetail() {
    document.getElementById('listName').textContent = state.currentName;
    var done = state.items.filter(function (i) { return i.done; }).length;
    document.getElementById('listProgress').textContent =
      state.items.length === 0 ? '还没有条目' : done + ' / ' + state.items.length + ' 已完成';

    itemsBox.innerHTML = '';
    state.items.forEach(function (item) { itemsBox.appendChild(itemRow(item)); });
    document.getElementById('emptyItems').hidden = state.items.length !== 0;
    document.getElementById('clearDone').disabled = done === 0;
  }

  function itemRow(item) {
    var row = el('div', 'item' + (item.done ? ' done' : ''));

    var check = el('div', 'check', '✓');
    check.onclick = function () { toggleItem(item); };
    row.appendChild(check);
    row.appendChild(el('div', 'txt', item.content));

    var acts = el('div', 'acts');
    if (!item.done) {
      var toTask = el('span', null, '转任务');
      toTask.onclick = function () { convertToTask(item); };
      acts.appendChild(toTask);
    }
    var del = el('span', 'del', '删');
    del.onclick = function () { deleteItem(item); };
    acts.appendChild(del);
    row.appendChild(acts);
    return row;
  }

  // ---- 写 ----

  /// 空态给一份示例。
  ///
  /// 新用户点进来只看到「还没有清单」，很难想象这功能能干什么（用户 2026-11-16
  /// 反馈"各模式无预设模板，上手有理解困难"）。名字带「（示例）」，
  /// 一眼能认出不是自己的数据，删起来也不心疼。
  async function seedShelf() {
    var btn = document.getElementById('seedShelf');
    if (btn) {
      btn.disabled = true;
      btn.textContent = '载入中…';
    }

    try {
      await seedShelfInner();
    } catch (error) {
      // 不接住的话按钮永远停在「载入中…」，用户只看到"点了没反应"。
      console.log('[seed] 失败 ' + (error && error.message ? error.message : error));
      toast('示例没写成：' + (error && error.message ? error.message : error));
      if (btn) {
        btn.disabled = false;
        btn.textContent = '载入示例：露营打包';
      }
    }
  }

  async function seedShelfInner() {
    var inserted = await window.host.call('db.insert', {
      table: 'lists',
      values: {
        name: '露营打包（示例）',
        is_template: 0,
        created_at: nowIso(),
        used_at: nowIso()
      }
    });
    var listId = inserted && inserted.id;

    // 故意留两条已勾上：进度条和非空的样子，比空列表能说明问题
    var rows = [['帐篷', 1], ['睡袋', 1], ['炉具', 0], ['头灯', 0], ['充电宝', 0]];
    if (listId != null) {
      for (var i = 0; i < rows.length; i++) {
        await window.host.call('db.insert', {
          table: 'items',
          values: {
            list_id: listId,
            content: rows[i][0],
            done: rows[i][1],
            sort_order: i + 1
          }
        });
      }
    }
    await reloadLists();
    toast('已载入示例，点开看看');
  }

  async function createList(name, templateId) {
    var trimmed = String(name || '').trim();
    if (!trimmed) return;

    var inserted = await window.host.call('db.insert', {
      table: 'lists',
      values: { name: trimmed, is_template: 0, created_at: nowIso(), used_at: nowIso() }
    });
    var listId = inserted && inserted.id;

    if (templateId != null && listId != null) {
      var source = (await window.host.call('db.select', {
        table: 'items',
        where: [{ column: 'list_id', value: templateId }],
        orderBy: [{ column: 'sort_order' }, { column: 'id' }],
        limit: 500
      })) || [];
      for (var i = 0; i < source.length; i++) {
        await window.host.call('db.insert', {
          table: 'items',
          values: { list_id: listId, content: source[i].content, done: 0, sort_order: i }
        });
      }
    }

    await reloadLists();
    if (listId != null) {
      var created = state.lists.filter(function (l) { return l.id === listId; })[0];
      if (created) openList(created);
    }
  }

  async function createFromTemplate(template) {
    var d = new Date();
    var name = await askText('新清单的名字', template.name + ' ' + (d.getMonth() + 1) + '/' + d.getDate());
    if (name == null) return;
    await createList(name, template.id);
  }

  function openList(list) {
    state.currentId = list.id;
    state.currentName = list.name;
    state.view = 'list';
    shelf.classList.remove('on');
    detail.classList.add('on');
    window.host.call('db.update', {
      table: 'lists',
      values: { used_at: nowIso() },
      where: [{ column: 'id', value: list.id }]
    });
    reloadItems();
  }

  function backToShelf() {
    state.view = 'shelf';
    state.currentId = null;
    state.currentName = '';
    detail.classList.remove('on');
    shelf.classList.add('on');
    reloadLists();
  }

  async function addItem() {
    var input = document.getElementById('itemInput');
    var text = input.value.trim();
    if (!text || state.currentId == null) return;
    input.value = '';
    document.getElementById('addItem').disabled = true;

    var max = state.items.reduce(function (acc, it) {
      return Math.max(acc, it.sort_order || 0);
    }, 0);

    await window.host.call('db.insert', {
      table: 'items',
      values: { list_id: state.currentId, content: text, done: 0, sort_order: max + 1 }
    });
    await reloadItems();
    input.focus();
  }

  async function toggleItem(item) {
    await window.host.call('db.update', {
      table: 'items',
      values: { done: item.done ? 0 : 1 },
      where: [{ column: 'id', value: item.id }]
    });
    await reloadItems();
  }

  async function deleteItem(item) {
    await window.host.call('db.delete', {
      table: 'items',
      where: [{ column: 'id', value: item.id }]
    });
    await reloadItems();
  }

  async function clearDone() {
    var done = state.items.filter(function (i) { return i.done; });
    if (done.length === 0) return;
    if (!confirm('删掉这 ' + done.length + ' 条已完成的条目？')) return;
    for (var i = 0; i < done.length; i++) {
      await window.host.call('db.delete', {
        table: 'items',
        where: [{ column: 'id', value: done[i].id }]
      });
    }
    await reloadItems();
  }

  async function convertToTask(item) {
    try {
      await window.host.call('task.create', { title: item.content });
      await window.host.call('db.update', {
        table: 'items',
        values: { done: 1 },
        where: [{ column: 'id', value: item.id }]
      });
      await reloadItems();
      toast('已加到任务，这条标为完成');
    } catch (e) {
      toast('转任务失败：' + ((e && e.message) || e));
    }
  }

  async function saveAsTemplate() {
    if (state.currentId == null) return;
    var name = await askText('模板名字', state.currentName);
    if (name == null || !name.trim()) return;

    var inserted = await window.host.call('db.insert', {
      table: 'lists',
      values: { name: name.trim(), is_template: 1, created_at: nowIso(), used_at: nowIso() }
    });
    var tplId = inserted && inserted.id;
    if (tplId == null) return;

    for (var i = 0; i < state.items.length; i++) {
      await window.host.call('db.insert', {
        table: 'items',
        values: { list_id: tplId, content: state.items[i].content, done: 0, sort_order: i }
      });
    }
    toast('已存为模板');
    backToShelf();
  }

  async function deleteList() {
    if (state.currentId == null) return;
    if (!confirm('删除「' + state.currentName + '」和它的所有条目？')) return;
    var id = state.currentId;
    await window.host.call('db.delete', { table: 'items', where: [{ column: 'list_id', value: id }] });
    await window.host.call('db.delete', { table: 'lists', where: [{ column: 'id', value: id }] });
    backToShelf();
  }

  // ---- 事件 ----

  document.getElementById('seedShelf').onclick = seedShelf;

  document.getElementById('newList').onclick = async function () {
    var name = await askText('清单名字', '');
    if (name == null) return;
    createList(name);
  };

  document.getElementById('back').onclick = backToShelf;

  var input = document.getElementById('itemInput');
  input.addEventListener('input', function () {
    document.getElementById('addItem').disabled = input.value.trim().length === 0;
  });
  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') addItem();
  });
  document.getElementById('addItem').onclick = addItem;
  document.getElementById('clearDone').onclick = clearDone;
  document.getElementById('saveTemplate').onclick = saveAsTemplate;
  document.getElementById('deleteList').onclick = deleteList;

  whenHostReady(reloadLists);
})();
</script>
</body>
</html>
