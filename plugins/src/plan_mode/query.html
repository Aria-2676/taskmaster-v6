<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>plan query</title></head>
<body>
<script>
// 离屏查询入口：不渲染 UI，只回答"进行中的计划有哪些、进度多少"。
//
// 2.0.0 起计划有了自己的数据（plg_plan_*），这里要算一遍进度：
// 阶段 / 里程碑 / 关联任务的完成率。任务完成状态仍然问主包要 ——
// 计划表只存 task_id，不复制任务内容（两份真相是 `decisions.md` 699 反对的）。
(function () {
  function register() {
    if (!window.host || typeof window.host.onQuery !== 'function') {
      setTimeout(register, 50);
      return;
    }

    window.host.onQuery('plan.list', function () {
      return Promise.all([
        // 不在 SQL 层过滤 status：实测 where 传整数值 0 时结果为空
        // （2026-11-16），改在前端过滤，稳一点
        window.host.call('db.select', {
          table: 'plans',
          orderBy: [{ column: 'created_at', desc: true }],
          limit: 50
        }),
        window.host.call('db.select', { table: 'stages', limit: 500 }),
        window.host.call('db.select', { table: 'milestones', limit: 500 }),
        window.host.call('db.select', { table: 'plan_tasks', limit: 500 }),
        window.host.call('task.list', { from: '2000-01-01', to: '2100-01-01', limit: 500 })
      ]).then(function (r) {
        var plans = (r[0] || []).filter(function (p) { return !p.status; });
        // 每张表的原始行数都打出来：空块到底是"查不到"还是"过滤掉了"，
        // 光看 active=0 分不清（2026-11-16 今日页计划块就是这个症状）。
        console.log('[plan-query] tables plans=' + (r[0] || []).length +
          ' stages=' + (r[1] || []).length +
          ' milestones=' + (r[2] || []).length +
          ' links=' + (r[3] || []).length +
          ' tasks=' + (r[4] || []).length +
          ' active=' + plans.length +
          ' first=' + JSON.stringify((r[0] || [])[0] || null));
        var stages = r[1] || [];
        var milestones = r[2] || [];
        var links = r[3] || [];
        var tasks = r[4] || [];

        var doneById = {};
        // task.list 返回 isDone（不是 done）—— 2.0.2 改插件页时漏了这一处
        tasks.forEach(function (t) { doneById[t.id] = !!t.isDone; });

        var items = plans.map(function (plan) {
          var mine = function (row) { return row.plan_id === plan.id; };
          var s = stages.filter(mine);
          var m = milestones.filter(mine);
          var l = links.filter(mine);

          var done = s.filter(function (x) { return x.done; }).length
            + m.filter(function (x) { return x.done; }).length
            + l.filter(function (x) { return doneById[x.task_id]; }).length;
          var total = s.length + m.length + l.length;

          return {
            // 带上 id：今日页点这一行时要靠它直接进详情
            id: plan.id,
            name: plan.name,
            percent: total === 0 ? 0 : Math.round(done * 100 / total),
            endDate: plan.end_date || ''
          };
        });

        return { plans: items.slice(0, 3) };
      }).catch(function (error) {
        // 任一查询失败会让整条 Promise.all 挂掉，界面表现和"没有计划"一样。
        // 这里必须留痕，否则只能靠猜（宿主侧只会看到"结果为空"）。
        console.log('[plan-query] 失败 ' + (error && error.message ? error.message : error));
        return { plans: [] };
      });
    });

    if (typeof HostBridge !== 'undefined' && HostBridge.postMessage) {
      HostBridge.postMessage(JSON.stringify({ queryReady: true }));
    }
  }
  register();
})();
</script>
</body>
</html>
