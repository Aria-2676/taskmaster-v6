<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>计划</title>
<style>
  :root {
    --bg: #faf8fd; --card: #ffffff; --line: #e6e0ee;
    --text: #1d1b20; --muted: #79747e; --accent: #6750a4; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141218; --card: #211f26; --line: #332f3a;
      --text: #e6e0e9; --muted: #938f99; --accent: #d0bcff; --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .view { display: none; }
  .view.on { display: block; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px 10px; position: sticky; top: 0;
    background: var(--bg); z-index: 2;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; }
  .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  button {
    font: inherit; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #fff; padding: 7px 13px;
  }
  button.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
  button.danger { background: transparent; color: var(--danger); }
  button:disabled { opacity: .4; }
  .section {
    font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 14px 14px 6px; display: flex; align-items: center; gap: 8px;
  }
  .section .spacer { flex: 1; }
  .section .act { font-size: 12px; color: var(--accent); cursor: pointer; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin: 0 14px 8px;
  }
  .card .title { font-weight: 500; }
  .card .goal { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 9px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; justify-content: space-between; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; }
  .check {
    width: 20px; height: 20px; border-radius: 6px; flex: none;
    border: 1.5px solid var(--line); margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .item .txt { flex: 1; line-height: 1.45; word-break: break-word; }
  .item.done .txt { text-decoration: line-through; color: var(--muted); }
  .item .acts { display: flex; gap: 8px; flex: none; }
  .item .acts span { font-size: 11.5px; color: var(--accent); cursor: pointer; }
  .item .acts span.del { color: var(--danger); }
  .dateTag { font-size: 11px; color: var(--muted); margin-top: 2px; }
  input, textarea {
    font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; outline: 0; width: 100%;
  }
  textarea { resize: none; min-height: 52px; }
  .addRow { display: flex; gap: 8px; padding: 4px 14px 8px; }
  .addRow input { flex: 1; }
  .footer { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 12px 14px; }
  .mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.42);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 50;
  }
  .mask[hidden] { display: none; }
  .dialog {
    background: var(--card); border-radius: 16px; padding: 18px;
    width: 100%; max-width: 340px; max-height: 80vh; overflow: auto;
  }
  .dialog .dTitle { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .dialog label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .pickerRow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .pickerRow .t { flex: 1; font-size: 13.5px; }
</style>
</head>
<body>

<!-- 计划列表 -->
<div class="view on" id="shelf">
  <header>
    <h1>计划</h1>
    <button id="newPlan">新建</button>
  </header>
  <div id="plans"></div>
  <div class="empty" id="emptyShelf" hidden>
    <div style="line-height:1.7;margin-bottom:10px">
      还没有计划。计划是把一个目标拆成阶段和里程碑，进度自己会算。
    </div>
    <button class="ghost" id="seedShelf">载入示例：学英语 30 天</button>
  </div>
</div>

<!-- 计划详情 -->
<div class="view" id="detail">
  <header>
    <button class="ghost" id="back">返回</button>
    <div style="flex:1;min-width:0">
      <h1 id="planName" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h1>
      <div class="sub" id="planMeta"></div>
    </div>
  </header>

  <div class="card" style="margin-top:4px">
    <div class="goal" id="planGoal"></div>
    <div class="bar"><i id="planBar"></i></div>
    <div class="meta"><span id="planPercent">0%</span><span id="planCounts"></span></div>
  </div>

  <div class="section">阶段<span class="spacer"></span><span class="act" id="addStageAct">+ 加阶段</span></div>
  <div id="stages"></div>
  <div class="empty" id="emptyStages" hidden>还没有阶段</div>

  <div class="section">里程碑<span class="spacer"></span><span class="act" id="addMilestoneAct">+ 加里程碑</span></div>
  <div id="milestones"></div>
  <div class="empty" id="emptyMilestones" hidden>还没有里程碑</div>

  <div class="section">任务<span class="spacer"></span><span class="act" id="addTasksAct">+ 排入任务</span></div>
  <div id="tasks"></div>
  <div class="empty" id="emptyTasks" hidden>还没有排任务</div>

  <div class="footer">
    <button class="danger" id="deletePlan">删除计划</button>
  </div>
</div>

<!-- 新建计划 -->
<div class="mask" id="planMask" hidden>
  <div class="dialog">
    <div class="dTitle">新建计划</div>
    <label>名字</label>
    <input id="pName" placeholder="比如：三个月读完 12 本书">
    <label>目标（可选）</label>
    <textarea id="pGoal" placeholder="想达成什么"></textarea>
    <label>起止</label>
    <div style="display:flex;gap:8px">
      <input type="date" id="pStart">
      <input type="date" id="pEnd">
    </div>
    <div class="actions">
      <button class="ghost" id="planCancel">取消</button>
      <button id="planOk">创建</button>
    </div>
  </div>
</div>

<!-- 加阶段 / 加里程碑 -->
<div class="mask" id="askMask" hidden>
  <div class="dialog">
    <div class="dTitle" id="askTitle"></div>
    <input id="askInput" autocomplete="off">
    <input type="date" id="askDate" style="margin-top:8px" hidden>
    <div class="actions">
      <button class="ghost" id="askCancel">取消</button>
      <button id="askOk">确定</button>
    </div>
  </div>
</div>

<!-- 任务选择 -->
<div class="mask" id="pickerMask" hidden>
  <div class="dialog">
    <div class="dTitle">排入任务</div>
    <div id="pickerList" style="max-height:52vh;overflow:auto"></div>
    <div class="empty" id="pickerEmpty" hidden>没有可排的未完成任务</div>
    <div class="actions">
      <button class="ghost" id="pickerCancel">取消</button>
      <button id="pickerOk">加入</button>
    </div>
  </div>
</div>

<script>
(function () {
  var state = {
    plans: [],
    plan: null,
    stages: [],
    milestones: [],
    tasks: [],        // 关联任务（含主包字段）
    allTasks: [],     // 可排入的主包任务
    selected: {},     // 选择器里勾中的 taskId
  };

  function whenHostReady(fn, tries) {
    tries = tries || 0;
    if (window.host) return fn();
    if (tries > 100) return;
    setTimeout(function () { whenHostReady(fn, tries + 1); }, 50);
  }

  function nowIso() { return new Date().toISOString(); }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function toast(text) {
    var box = document.getElementById('toast');
    if (!box) {
      box = el('div');
      box.id = 'toast';
      box.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
        'background:rgba(0,0,0,.82);color:#fff;font-size:12.5px;padding:8px 14px;' +
        'border-radius:20px;z-index:99;transition:opacity .2s;pointer-events:none';
      document.body.appendChild(box);
    }
    box.textContent = text;
    box.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { box.style.opacity = '0'; }, 1400);
  }

  // 页面内输入弹层（不用 window.prompt：它会弹 Android 原生灰框，2026-11-16 实测）
  function askText(title, defaultValue, withDate) {
    return new Promise(function (resolve) {
      var mask = document.getElementById('askMask');
      var input = document.getElementById('askInput');
      var dateInput = document.getElementById('askDate');
      document.getElementById('askTitle').textContent = title;
      input.value = defaultValue || '';
      dateInput.hidden = !withDate;
      if (withDate) dateInput.value = todayKey();
      mask.hidden = false;
      input.focus();

      function done(ok) {
        mask.hidden = true;
        document.getElementById('askOk').onclick = null;
        document.getElementById('askCancel').onclick = null;
        resolve(ok ? { text: input.value, date: dateInput.value } : null);
      }
      document.getElementById('askOk').onclick = function () { done(true); };
      document.getElementById('askCancel').onclick = function () { done(false); };
    });
  }

  // ---- 列表 ----

  async function loadPlans() {
    state.plans = (await window.host.call('db.select', {
      table: 'plans',
      orderBy: [{ column: 'status' }, { column: 'created_at', desc: true }],
      limit: 100
    })) || [];
    renderShelf();
  }

  function renderShelf() {
    var box = document.getElementById('plans');
    box.innerHTML = '';
    state.plans.forEach(function (p) { box.appendChild(planCard(p)); });
    document.getElementById('emptyShelf').hidden = state.plans.length !== 0;
    // 列表到位了才有对象可开 —— 带参数打开时，打开动作就发生在这一步之后
    tryOpenFromHost();
  }

  /// 带参数打开：`{'kind': 'plan', 'id': 7}` 直接落到那条计划的详情。
  ///
  /// 主包注入两样东西（见 PluginPage 的 `_injectOpenWith`）：
  /// `window.__hostOpen` 和 `host-open` 事件。两个都要接 —— 页面加载快的
  /// 时候事件早于脚本注册，页面加载慢的时候只有事件能拿到。
  var pendingOpen = null;

  window.addEventListener('host-open', function (event) {
    pendingOpen = event.detail || null;
    tryOpenFromHost();
  });

  function tryOpenFromHost() {
    var wanted = pendingOpen || window.__hostOpen;
    if (!wanted || wanted.kind !== 'plan' || wanted.id == null) return;
    if (!state.plans.length) return; // 列表还没拉回来，等 loadPlans 再调一次
    var hit = null;
    for (var i = 0; i < state.plans.length; i++) {
      if (state.plans[i].id === wanted.id) { hit = state.plans[i]; break; }
    }
    if (!hit) {
      // 计划可能已经被删了。说清楚比默默停在列表上好。
      toast('这条计划已经不在了');
      pendingOpen = null;
      window.__hostOpen = null;
      return;
    }
    pendingOpen = null;
    window.__hostOpen = null;
    openPlan(hit);
  }

  function planCard(plan) {
    var card = el('div', 'card');
    card.appendChild(el('div', 'title', plan.name));
    if (plan.goal) card.appendChild(el('div', 'goal', plan.goal));

    var bar = el('div', 'bar');
    var fill = el('i');
    bar.appendChild(fill);
    card.appendChild(bar);

    var meta = el('div', 'meta');
    var range = (plan.start_date || '') + ' ~ ' + (plan.end_date || '');
    meta.appendChild(el('span', null, range.trim() === '~' ? '未设日期' : range));
    meta.appendChild(el('span', null, plan.status ? '已结束' : '进行中'));
    card.appendChild(meta);

    card.onclick = function () { openPlan(plan); };
    // 进度要异步算（阶段/里程碑/任务的完成率），先按 0 画，到了再填
    loadProgress(plan.id).then(function (p) {
      fill.style.width = p.percent + '%';
    });
    return card;
  }

  async function loadProgress(planId) {
    var stages = (await window.host.call('db.select', {
      table: 'stages', where: [{ column: 'plan_id', value: planId }], limit: 200
    })) || [];
    var milestones = (await window.host.call('db.select', {
      table: 'milestones', where: [{ column: 'plan_id', value: planId }], limit: 200
    })) || [];
    var links = (await window.host.call('db.select', {
      table: 'plan_tasks', where: [{ column: 'plan_id', value: planId }], limit: 300
    })) || [];
    return computeProgress(stages, milestones, links, planId);
  }

  function computeProgress(stages, milestones, links, planId) {
    var doneStage = stages.filter(function (s) { return s.done; }).length;
    var doneMs = milestones.filter(function (m) { return m.done; }).length;
    var doneTask = links.filter(function (l) { return l.task_done; }).length;
    var total = stages.length + milestones.length + links.length;
    var done = doneStage + doneMs + doneTask;
    return {
      percent: total === 0 ? 0 : Math.round(done * 100 / total),
      done: done,
      total: total,
    };
  }

  // ---- 详情 ----

  async function openPlan(plan) {
    state.plan = plan;
    document.getElementById('planName').textContent = plan.name;
    document.getElementById('planMeta').textContent =
      ((plan.start_date || '') + ' ~ ' + (plan.end_date || '')).replace(/^~$/, '未设日期');
    document.getElementById('planGoal').textContent = plan.goal || '';

    document.getElementById('shelf').classList.remove('on');
    document.getElementById('detail').classList.add('on');

    await reloadDetail();
  }

  async function reloadDetail() {
    var planId = state.plan.id;
    state.stages = (await window.host.call('db.select', {
      table: 'stages', where: [{ column: 'plan_id', value: planId }],
      orderBy: [{ column: 'sort_order' }, { column: 'id' }], limit: 200
    })) || [];
    state.milestones = (await window.host.call('db.select', {
      table: 'milestones', where: [{ column: 'plan_id', value: planId }],
      orderBy: [{ column: 'due_date' }, { column: 'id' }], limit: 200
    })) || [];

    var links = (await window.host.call('db.select', {
      table: 'plan_tasks', where: [{ column: 'plan_id', value: planId }], limit: 300
    })) || [];

    // 关联任务的标题/完成状态要问主包要（计划表里只存 task_id）
    state.tasks = [];
    if (links.length > 0) {
      var all = (await window.host.call('task.list', {
        from: '2000-01-01', to: '2100-01-01', limit: 500
      })) || [];
      var byId = {};
      all.forEach(function (t) { byId[t.id] = t; });
      links.forEach(function (link) {
        var task = byId[link.task_id];
        state.tasks.push({
          linkId: link.id,
          taskId: link.task_id,
          title: task ? task.title : '（任务已删除）',
          done: task ? !!task.isDone : false,
          date: task ? task.dueDate : null,
          missing: !task,
        });
      });
    }

    // 给 computeProgress 用的字段名叫 task_done，这里补上
    var enrichedLinks = state.tasks.map(function (t) { return { task_done: t.done }; });
    var p = computeProgress(state.stages, state.milestones, enrichedLinks, planId);
    document.getElementById('planBar').style.width = p.percent + '%';
    document.getElementById('planPercent').textContent = p.percent + '%';
    document.getElementById('planCounts').textContent =
      p.total === 0 ? '还没有可计数的内容' : (p.done + ' / ' + p.total + ' 项');

    renderStages();
    renderMilestones();
    renderTasks();
  }

  function renderStages() {
    var box = document.getElementById('stages');
    box.innerHTML = '';
    state.stages.forEach(function (s) {
      var row = el('div', 'item' + (s.done ? ' done' : ''));
      var check = el('div', 'check', '✓');
      check.onclick = function () { toggleStage(s); };
      row.appendChild(check);
      row.appendChild(el('div', 'txt', s.name));
      var acts = el('div', 'acts');
      var del = el('span', 'del', '删');
      del.onclick = function () { deleteStage(s); };
      acts.appendChild(del);
      row.appendChild(acts);
      box.appendChild(row);
    });
    document.getElementById('emptyStages').hidden = state.stages.length !== 0;
  }

  function renderMilestones() {
    var box = document.getElementById('milestones');
    box.innerHTML = '';
    state.milestones.forEach(function (m) {
      var row = el('div', 'item' + (m.done ? ' done' : ''));
      var check = el('div', 'check', '✓');
      check.onclick = function () { toggleMilestone(m); };
      row.appendChild(check);

      var txt = el('div', 'txt');
      txt.appendChild(el('div', null, m.name));
      if (m.due_date) txt.appendChild(el('div', 'dateTag', m.due_date));
      row.appendChild(txt);

      var acts = el('div', 'acts');
      var del = el('span', 'del', '删');
      del.onclick = function () { deleteMilestone(m); };
      acts.appendChild(del);
      row.appendChild(acts);
      box.appendChild(row);
    });
    document.getElementById('emptyMilestones').hidden = state.milestones.length !== 0;
  }

  function renderTasks() {
    var box = document.getElementById('tasks');
    box.innerHTML = '';
    state.tasks.forEach(function (t) {
      var row = el('div', 'item' + (t.done ? ' done' : ''));
      var check = el('div', 'check', '✓');
      // 以前这里是"只读"的（灰 0.5、没有 handler）：任务是主包的，计划只存 id。
      // 但界面上画了个方框，用户当然会点 —— 点了没反应就是 bug（2026-11-16）。
      // 改成直接调主包的 task.setDone：任务本身仍在主包，不存在两份真相。
      if (t.missing) {
        check.style.opacity = '.4';
      } else {
        check.onclick = function (event) {
          event.stopPropagation();
          toggleTask(t);
        };
      }
      row.appendChild(check);

      var txt = el('div', 'txt');
      txt.appendChild(el('div', null, t.title));
      if (t.date) txt.appendChild(el('div', 'dateTag', String(t.date).slice(0, 10)));
      row.appendChild(txt);

      var acts = el('div', 'acts');
      if (!t.missing) {
        var move = el('span', null, '改期');
        move.onclick = function () { changeTaskDate(t); };
        acts.appendChild(move);
      }
      var del = el('span', 'del', '移除');
      del.onclick = function () { removeTask(t); };
      acts.appendChild(del);
      row.appendChild(acts);
      box.appendChild(row);
    });
    document.getElementById('emptyTasks').hidden = state.tasks.length !== 0;
  }

  /// 勾选关联任务。改的是主包里的那条任务，不是计划里的副本。
  async function toggleTask(t) {
    if (t.missing || !t.taskId) {
      toast('这条任务已经不在主包里了');
      return;
    }
    var next = !t.done;
    var r;
    try {
      r = await window.host.call('task.setDone', { id: t.taskId, done: next });
    } catch (error) {
      // host.call 在权限不足 / 参数错时是直接抛的，不接住的话界面一动不动
      toast('改不动：' + (error && error.message ? error.message : error));
      return;
    }
    if (!r || r.error) {
      toast('改不动：' + ((r && r.error) || '未知原因'));
      return;
    }
    // 本地先改再重拉：重拉要等主包吐数据，中间那一两百毫秒界面会"点不动"
    t.done = next;
    renderTasks();
    await reloadDetail();
    toast(next ? '已完成' : '已取消完成');
  }

  // ---- 写 ----

  /// 空态给一份示例：阶段、里程碑、进度条都摆出来，比一句"还没有计划"清楚。
  ///
  /// 名字带「（示例）」：一眼能认出不是自己建的，删起来不心疼。
  /// 不建关联任务 —— 那会往主包的任务列表里塞东西，用户没要求的不能塞。
  async function seedShelf() {
    var btn = document.getElementById('seedShelf');
    if (btn) {
      btn.disabled = true;
      btn.textContent = '载入中…';
    }

    try {
      await seedShelfInner();
    } catch (error) {
      console.log('[seed] 失败 ' + (error && error.message ? error.message : error));
      toast('示例没写成：' + (error && error.message ? error.message : error));
      if (btn) {
        btn.disabled = false;
        btn.textContent = '载入示例：学英语 30 天';
      }
    }
  }

  async function seedShelfInner() {
    var start = todayKey();
    var end = new Date();
    end.setDate(end.getDate() + 30);
    var endKey = end.getFullYear() + '-' +
      pad(end.getMonth() + 1) + '-' + pad(end.getDate());

    var inserted = await window.host.call('db.insert', {
      table: 'plans',
      values: {
        name: '学英语 30 天（示例）',
        goal: '每天 30 分钟，月底能不看字幕看完一集',
        start_date: start,
        end_date: endKey,
        status: 0,
        created_at: nowIso()
      }
    });
    var planId = inserted && inserted.id;
    if (planId == null) {
      toast('示例没写成，再试一次');
      return;
    }

    var stages = [['背完第一单元', 1], ['每天听力 15 分钟', 0], ['口语跟读 10 句', 0]];
    for (var i = 0; i < stages.length; i++) {
      await window.host.call('db.insert', {
        table: 'stages',
        values: { plan_id: planId, name: stages[i][0], sort_order: i + 1, done: stages[i][1] }
      });
    }
    await window.host.call('db.insert', {
      table: 'milestones',
      values: { plan_id: planId, name: '能复述一段新闻', due_date: endKey, done: 0 }
    });

    await loadPlans();
    toast('已载入示例，点开看看阶段和进度');
  }

  async function createPlan() {
    var name = document.getElementById('pName').value.trim();
    if (!name) { toast('名字不能为空'); return; }
    await window.host.call('db.insert', {
      table: 'plans',
      values: {
        name: name,
        goal: document.getElementById('pGoal').value.trim(),
        start_date: document.getElementById('pStart').value || '',
        end_date: document.getElementById('pEnd').value || '',
        status: 0,
        created_at: nowIso()
      }
    });
    document.getElementById('planMask').hidden = true;
    document.getElementById('pName').value = '';
    document.getElementById('pGoal').value = '';
    await loadPlans();
  }

  async function addStage() {
    var r = await askText('阶段名字', '');
    if (!r || !r.text.trim()) return;
    var max = state.stages.reduce(function (a, s) { return Math.max(a, s.sort_order || 0); }, 0);
    await window.host.call('db.insert', {
      table: 'stages',
      values: { plan_id: state.plan.id, name: r.text.trim(), sort_order: max + 1, done: 0 }
    });
    await reloadDetail();
  }

  async function toggleStage(stage) {
    await window.host.call('db.update', {
      table: 'stages', values: { done: stage.done ? 0 : 1 },
      where: [{ column: 'id', value: stage.id }]
    });
    await reloadDetail();
  }

  async function deleteStage(stage) {
    await window.host.call('db.delete', { table: 'stages', where: [{ column: 'id', value: stage.id }] });
    await reloadDetail();
  }

  async function addMilestone() {
    var r = await askText('里程碑名字', '', true);
    if (!r || !r.text.trim()) return;
    await window.host.call('db.insert', {
      table: 'milestones',
      values: { plan_id: state.plan.id, name: r.text.trim(), due_date: r.date || '', done: 0 }
    });
    await reloadDetail();
  }

  async function toggleMilestone(ms) {
    await window.host.call('db.update', {
      table: 'milestones', values: { done: ms.done ? 0 : 1 },
      where: [{ column: 'id', value: ms.id }]
    });
    await reloadDetail();
  }

  async function deleteMilestone(ms) {
    await window.host.call('db.delete', { table: 'milestones', where: [{ column: 'id', value: ms.id }] });
    await reloadDetail();
  }

  async function openPicker() {
    state.allTasks = (await window.host.call('task.list', {
      from: '2000-01-01', to: '2100-01-01', limit: 500
    })) || [];
    var linked = {};
    state.tasks.forEach(function (t) { linked[t.taskId] = true; });

    var candidates = state.allTasks.filter(function (t) {
      // task.list 返回的是 isDone / dueDate（不是 done / date）
      return !t.isDone && !linked[t.id];
    });

    state.selected = {};
    var box = document.getElementById('pickerList');
    box.innerHTML = '';
    candidates.forEach(function (t) {
      var row = el('div', 'pickerRow');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.style.width = '18px';
      cb.onchange = function () {
        if (cb.checked) state.selected[t.id] = true;
        else delete state.selected[t.id];
      };
      row.appendChild(cb);
      var txt = el('div', 't');
      txt.appendChild(el('div', null, t.title));
      if (t.dueDate) txt.appendChild(el('div', 'dateTag', String(t.dueDate).slice(0, 10)));
      row.appendChild(txt);
      box.appendChild(row);
    });

    document.getElementById('pickerEmpty').hidden = candidates.length !== 0;
    document.getElementById('pickerMask').hidden = false;
  }

  async function confirmPicker() {
    var ids = Object.keys(state.selected);
    for (var i = 0; i < ids.length; i++) {
      await window.host.call('db.insert', {
        table: 'plan_tasks',
        values: { plan_id: state.plan.id, task_id: Number(ids[i]) }
      });
    }
    document.getElementById('pickerMask').hidden = true;
    await reloadDetail();
  }

  async function removeTask(t) {
    await window.host.call('db.delete', {
      table: 'plan_tasks', where: [{ column: 'id', value: t.linkId }]
    });
    await reloadDetail();
  }

  async function changeTaskDate(t) {
    var r = await askText('「' + t.title + '」改到哪天', '', true);
    if (!r || !r.date) return;
    try {
      await window.host.call('task.update', { id: t.taskId, date: r.date });
      await reloadDetail();
      toast('已改到 ' + r.date);
    } catch (e) {
      toast('改期失败：' + ((e && e.message) || e));
    }
  }

  async function deletePlan() {
    if (!state.plan) return;
    if (!confirm('删除「' + state.plan.name + '」和它的阶段、里程碑？')) return;
    var id = state.plan.id;
    await window.host.call('db.delete', { table: 'stages', where: [{ column: 'plan_id', value: id }] });
    await window.host.call('db.delete', { table: 'milestones', where: [{ column: 'plan_id', value: id }] });
    await window.host.call('db.delete', { table: 'plan_tasks', where: [{ column: 'plan_id', value: id }] });
    await window.host.call('db.delete', { table: 'plans', where: [{ column: 'id', value: id }] });
    back();
  }

  function back() {
    state.plan = null;
    document.getElementById('detail').classList.remove('on');
    document.getElementById('shelf').classList.add('on');
    loadPlans();
  }

  // ---- 事件 ----

  document.getElementById('newPlan').onclick = function () {
    var d = new Date();
    document.getElementById('pStart').value = todayKey();
    d.setDate(d.getDate() + 30);
    document.getElementById('pEnd').value =
      d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    document.getElementById('planMask').hidden = false;
    document.getElementById('pName').focus();
  };
  document.getElementById('planCancel').onclick = function () {
    document.getElementById('planMask').hidden = true;
  };
  document.getElementById('planOk').onclick = createPlan;

  document.getElementById('back').onclick = back;
  document.getElementById('seedShelf').onclick = seedShelf;
  document.getElementById('addStageAct').onclick = addStage;
  document.getElementById('addMilestoneAct').onclick = addMilestone;
  document.getElementById('addTasksAct').onclick = openPicker;
  document.getElementById('deletePlan').onclick = deletePlan;

  document.getElementById('pickerCancel').onclick = function () {
    document.getElementById('pickerMask').hidden = true;
  };
  document.getElementById('pickerOk').onclick = confirmPicker;

  whenHostReady(loadPlans);
})();
</script>
</body>
</html>
