<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>list query</title></head>
<body>
<script>
// 离屏查询入口：不渲染 UI，只回答"还有多少条没勾"。
// 今日页用它在不动用主包的情况下显示清单进度。
(function () {
  function register() {
    if (!window.host || typeof window.host.onQuery !== 'function') {
      setTimeout(register, 50);
      return;
    }

    window.host.onQuery('list.pending', function () {
      // 不在 SQL 层过滤 done=0：计划插件上实测过「where 传整数 0 查不到」
      // （2026-11-16，宿主 select 的单测却正常），这里统一在前端过滤，稳。
      return window.host.call('db.select', {
        table: 'items',
        limit: 500
      }).then(function (rows) {
        var list = (rows || []).filter(function (r) { return !r.done; });
        return { pending: list.length };
      });
    });

    // 全局搜索：**只搜条目内容，不搜清单名**。
    // 清单一般几十个，侧边栏和书架一眼能看到；条目动辄上百条，才是最需要搜的。
    // 命中条目的副标题带清单名，用户就知道它在哪个清单里。
    window.host.onQuery('list.search', function (params) {
      var kw = String((params && params.keyword) || '').trim().toLowerCase();
      if (!kw) return { items: [] };
      var limit = (params && params.limit) || 20;
      return Promise.all([
        window.host.call('db.select', { table: 'items', limit: 600 }),
        window.host.call('db.select', { table: 'lists', limit: 200 })
      ]).then(function (res) {
        var rows = res[0] || [];
        var lists = res[1] || [];
        var nameById = {};
        lists.forEach(function (l) { nameById[l.id] = l.name; });
        var hits = rows.filter(function (row) {
          return String(row.content || '').toLowerCase().indexOf(kw) >= 0;
        }).slice(0, limit).map(function (row) {
          var where = nameById[row.list_id] || '清单';
          return {
            id: row.id,
            title: row.content,
            subtitle: where + (row.done ? ' · 已完成' : '')
          };
        });
        return { items: hits };
      });
    });

    if (typeof HostBridge !== 'undefined' && HostBridge.postMessage) {
      HostBridge.postMessage(JSON.stringify({ queryReady: true }));
    }
  }
  register();
})();
</script>
</body>
</html>
