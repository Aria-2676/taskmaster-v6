<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>统计</title>
<style>
  :root {
    --bg: #faf8fd; --card: #ffffff; --line: #e6e0ee;
    --text: #1d1b20; --muted: #79747e; --accent: #6750a4;
    --bar: #8b6fc4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141218; --card: #211f26; --line: #332f3a;
      --text: #e6e0e9; --muted: #938f99; --accent: #d0bcff;
      --bar: #7f6aa8;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px 10px; position: sticky; top: 0;
    background: var(--bg); z-index: 2;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; }
  .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg span {
    padding: 6px 12px; font-size: 12.5px; color: var(--muted); cursor: pointer;
  }
  .seg span.on { background: var(--accent); color: #fff; }

  .refresh {
    width: 32px; height: 32px; flex: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 9px; color: var(--muted); cursor: pointer;
  }
  .refresh:active { background: var(--line); }
  .refresh.busy { color: var(--accent); }
  .refresh.busy svg { animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 刷新时间戳：让用户确认"确实拉到新数据了"，而不是数字没变就当没刷新 */
  .updated {
    font-size: 11px; color: var(--muted); text-align: center;
    padding: 8px 14px 0; min-height: 15px;
  }
  .updated.warn { color: #b3261e; }

  /* 下拉刷新：只在手势进行中显示，松手立即收起 */
  .pull {
    position: fixed; left: 0; right: 0; top: 0; z-index: 9;
    display: flex; align-items: flex-end; justify-content: center;
    height: 0; overflow: hidden; background: var(--bg);
    font-size: 11.5px; color: var(--muted); padding-bottom: 6px;
  }

  .cards { display: flex; gap: 8px; padding: 4px 14px 0; }
  .card {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 10px; text-align: center;
  }
  .card b { display: block; font-size: 20px; font-weight: 600; }
  .card span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  .section { font-size: 12px; font-weight: 600; color: var(--muted); padding: 18px 14px 8px; }
  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; margin: 0 14px; padding: 12px;
  }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
  .barWrap { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar { width: 100%; max-width: 22px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar.zero { background: var(--line); }
  .barLabel { font-size: 9.5px; color: var(--muted); margin-top: 4px; height: 12px; }
  .axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  .tagRow { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .tagRow .name { width: 76px; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tagRow .track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .tagRow .track i { display: block; height: 100%; background: var(--accent); }
  .tagRow .n { font-size: 11.5px; color: var(--muted); width: 28px; text-align: right; }

  .empty { color: var(--muted); font-size: 12.5px; padding: 10px 2px; }
  .hint { font-size: 11.5px; color: var(--muted); padding: 8px 14px 16px; line-height: 1.6; }
</style>
</head>
<body>

<div class="pull" id="pull"></div>

<header>
  <h1>统计</h1>
  <div class="seg">
    <span id="seg7" class="on">7 天</span>
    <span id="seg30">30 天</span>
  </div>
  <button class="refresh" id="refresh" aria-label="刷新">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
      <polyline points="21 3 21 9 15 9"/>
    </svg>
  </button>
</header>

<div class="updated" id="updated">正在加载…</div>

<div class="cards">
  <div class="card"><b id="cDone">–</b><span>完成任务</span></div>
  <div class="card"><b id="cFocus">–</b><span>专注时长</span></div>
  <div class="card"><b id="cStreak">–</b><span>连续天数</span></div>
</div>

<div class="section">每天完成</div>
<div class="panel">
  <div class="bars" id="bars"></div>
  <div class="axis"><span id="axisStart"></span><span id="axisEnd"></span></div>
  <div class="empty" id="emptyBars" hidden>这段时间还没有完成的任务</div>
</div>

<div class="section">标签分布</div>
<div class="panel" id="tagPanel">
  <div class="empty" id="emptyTags">还没有用过标签</div>
  <div id="tags"></div>
</div>

<div class="hint" id="hint"></div>

<script>
(function () {
  var state = { days: 7, tasks: [], sessions: [], loading: false, lastLoadAt: 0 };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  function whenHostReady(fn, tries) {
    tries = tries || 0;
    if (window.host) return fn();
    if (tries > 100) return;
    setTimeout(function () { whenHostReady(fn, tries + 1); }, 50);
  }

  function range() {
    var end = new Date();
    var start = new Date();
    start.setDate(start.getDate() - (state.days - 1));
    return { start: start, end: end };
  }

  // ---- 数据 ----

  /// 拉数据。**主动刷新和首次加载走同一条路**，避免两套逻辑算出不同的数。
  ///
  /// 三条刷新入口都调它：顶栏按钮、下拉手势、从后台切回来。
  /// 用 [state.loading] 防并发：连点刷新、下拉中途再点按钮都只会跑一次。
  async function load() {
    if (state.loading) return;
    state.loading = true;
    setBusy(true);

    try {
      var r = range();
      var from = keyOf(r.start);
      var to = keyOf(r.end);

      state.tasks = (await window.host.call('task.list', {
        from: from, to: to, limit: 500
      })) || [];

      try {
        state.sessions = (await window.host.call('timer.history', {
          since: r.start.toISOString(),
          limit: 200
        })) || [];
        // 契约是 {sessions: [...]}，兼容直接返回数组的实现
        if (!Array.isArray(state.sessions)) state.sessions = state.sessions.sessions || [];
      } catch (e) {
        // 没装番茄钟插件 / 没有权限，专注时长显示 0，不报错
        state.sessions = [];
      }

      render(r);
      state.lastLoadAt = Date.now();
      setUpdated('更新于 ' + stamp(), false);
    } catch (error) {
      // 刷新失败要说出来：数字停在旧值又没提示，用户会以为"数据就这样"
      setUpdated('刷新失败：' + describe(error), true);
    } finally {
      state.loading = false;
      setBusy(false);
    }
  }

  function stamp() {
    var d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function describe(error) {
    if (!error) return '未知错误';
    var text = error.message || String(error);
    return text.length > 60 ? text.slice(0, 60) + '…' : text;
  }

  function setBusy(busy) {
    document.getElementById('refresh').classList.toggle('busy', busy);
  }

  function setUpdated(text, warn) {
    var node = document.getElementById('updated');
    node.textContent = text;
    node.classList.toggle('warn', !!warn);
  }

  function render(r) {
    // 字段以 docs/capabilities.md 为准：isDone / dueDate
    var done = state.tasks.filter(function (t) { return t.isDone; });

    // 1. 完成数
    document.getElementById('cDone').textContent = String(done.length);

    // 2. 专注时长：只算专注模式，实际时长（actualSeconds）
    var focusSeconds = 0;
    state.sessions.forEach(function (s) {
      var mode = s.mode || '';
      if (mode && mode !== 'focus') return;
      focusSeconds += Number(s.actualSeconds || 0);
    });
    document.getElementById('cFocus').textContent = formatDuration(focusSeconds);

    // 3. 连续天数：从今天往回数，每天至少完成 1 个
    document.getElementById('cStreak').textContent = String(streakOf(done));

    renderBars(r, done);
    renderTags(done);

    document.getElementById('hint').textContent =
      '数据来自主包的任务和你装的番茄钟。没装番茄钟时专注时长为 0，不影响其他数字。' +
      '点右上角按钮或下拉可刷新。';
  }

  function formatDuration(seconds) {
    if (!seconds) return '0 分';
    if (seconds < 3600) return Math.round(seconds / 60) + ' 分';
    var h = seconds / 3600;
    return (Math.round(h * 10) / 10) + ' 小时';
  }

  /// 完成日：优先用 completedAt（真的哪天做完的），没有才回退 dueDate。
  /// 按 dueDate 归日会把"昨天逾期、今天做完"记到昨天，数字对但语义错。
  function dayOf(task) {
    var raw = task.completedAt || task.dueDate || '';
    return String(raw).slice(0, 10);
  }

  function streakOf(doneAll) {
    var byDay = {};
    doneAll.forEach(function (t) {
      var day = dayOf(t);
      if (day) byDay[day] = (byDay[day] || 0) + 1;
    });
    var count = 0;
    var d = new Date();
    for (var i = 0; i < 400; i++) {
      var k = keyOf(d);
      if (byDay[k]) {
        count++;
        d.setDate(d.getDate() - 1);
      } else {
        // 今天还没完成不算断档：从昨天继续数
        if (i === 0) { d.setDate(d.getDate() - 1); continue; }
        break;
      }
    }
    return count;
  }

  function renderBars(r, done) {
    var box = document.getElementById('bars');
    box.innerHTML = '';

    var byDay = {};
    done.forEach(function (t) {
      var day = dayOf(t);
      if (day) byDay[day] = (byDay[day] || 0) + 1;
    });

    var days = [];
    for (var i = 0; i < state.days; i++) {
      var d = new Date(r.start);
      d.setDate(d.getDate() + i);
      days.push(keyOf(d));
    }

    var max = 1;
    days.forEach(function (k) { max = Math.max(max, byDay[k] || 0); });

    days.forEach(function (k, idx) {
      var count = byDay[k] || 0;
      var wrap = el('div', 'barWrap');
      var bar = el('div', 'bar' + (count === 0 ? ' zero' : ''));
      bar.style.height = count === 0 ? '2px' : Math.max(6, Math.round(count * 96 / max)) + 'px';
      wrap.appendChild(bar);

      // 30 天时标签太密，只标首尾和每 5 天
      var showLabel = state.days <= 7 || idx === 0 || idx === days.length - 1 || idx % 5 === 0;
      wrap.appendChild(el('div', 'barLabel', showLabel ? String(Number(k.slice(-2))) : ''));
      box.appendChild(wrap);
    });

    document.getElementById('axisStart').textContent = days[0].slice(5);
    document.getElementById('axisEnd').textContent = days[days.length - 1].slice(5);
    document.getElementById('emptyBars').hidden = done.length !== 0;
  }

  function renderTags(done) {
    var box = document.getElementById('tags');
    box.innerHTML = '';
    var counts = {};
    done.forEach(function (t) {
      var tags = t.tags;
      if (Array.isArray(tags)) {
        tags.forEach(function (name) {
          if (typeof name === 'string' && name) counts[name] = (counts[name] || 0) + 1;
        });
      } else if (typeof tags === 'string' && tags) {
        tags.split(',').forEach(function (name) {
          var trimmed = name.trim();
          if (trimmed) counts[trimmed] = (counts[trimmed] || 0) + 1;
        });
      }
    });

    var names = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 8);
    document.getElementById('emptyTags').hidden = names.length !== 0;
    if (names.length === 0) return;

    var max = counts[names[0]];
    names.forEach(function (name) {
      var row = el('div', 'tagRow');
      row.appendChild(el('div', 'name', name));
      var track = el('div', 'track');
      var fill = el('i');
      fill.style.width = Math.max(6, Math.round(counts[name] * 100 / max)) + '%';
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el('div', 'n', String(counts[name])));
      box.appendChild(row);
    });
  }

  // ---- 事件 ----

  document.getElementById('seg7').onclick = function () { switchDays(7); };
  document.getElementById('seg30').onclick = function () { switchDays(30); };
  document.getElementById('refresh').onclick = function () { load(); };

  function switchDays(n) {
    if (state.days === n) return;
    state.days = n;
    document.getElementById('seg7').classList.toggle('on', n === 7);
    document.getElementById('seg30').classList.toggle('on', n === 30);
    load();
  }

  // ---- 下拉刷新 ----

  /// 只在页面已经滚到顶时接管下拉；不 preventDefault，正常滚动完全不受影响。
  var pull = { tracking: false, startY: 0, distance: 0 };
  var PULL_TRIGGER = 56;

  document.addEventListener('touchstart', function (event) {
    if (state.loading || window.scrollY > 0) return;
    pull.tracking = true;
    pull.startY = event.touches[0].clientY;
    pull.distance = 0;
  }, { passive: true });

  document.addEventListener('touchmove', function (event) {
    if (!pull.tracking) return;
    var dy = event.touches[0].clientY - pull.startY;
    if (dy <= 0) {
      pull.distance = 0;
      paintPull(false);
      return;
    }
    pull.distance = Math.min(90, dy);
    paintPull(pull.distance >= PULL_TRIGGER);
  }, { passive: true });

  document.addEventListener('touchend', function () {
    if (!pull.tracking) return;
    var fire = pull.distance >= PULL_TRIGGER;
    pull.tracking = false;
    pull.distance = 0;
    paintPull(false);
    if (fire) load();
  }, { passive: true });

  document.addEventListener('touchcancel', function () {
    pull.tracking = false;
    pull.distance = 0;
    paintPull(false);
  }, { passive: true });

  function paintPull(ready) {
    var box = document.getElementById('pull');
    box.style.height = pull.distance ? Math.min(44, Math.round(pull.distance * 0.6)) + 'px' : '0';
    box.textContent = pull.distance ? (ready ? '松开刷新' : '下拉刷新') : '';
  }

  // ---- 切回前台自动刷新 ----

  /// 用户切到别的 App 再回来时，数据可能已经变了（在通知栏点完成、在别处记了一笔）。
  /// 5 秒内刚拉过就跳过，避免和按钮/下拉连着拉两次。
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - state.lastLoadAt < 5000) return;
    load();
  });

  whenHostReady(load);
})();
</script>
</body>
</html>
