<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>番茄钟</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1b1f;
    --muted: #5f5e6a;
    --line: #e6e1ee;
    --accent: #6750a4;
    --chip: #eeedfe;
    --focus: #d64545;
    --break: #2f7d5d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141218;
      --fg: #e6e1e9;
      --muted: #a8a4b3;
      --line: #2b2830;
      --accent: #cfbdfe;
      --chip: #26215c;
      --focus: #ff8a8a;
      --break: #6fd3a4;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "Segoe UI", "Noto Sans SC", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { padding: 12px 16px 24px; display: flex; flex-direction: column; align-items: center; }

  .head { width: 100%; display: flex; align-items: baseline; gap: 8px; padding: 0 2px 6px; }
  .head h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .head .ver { color: var(--muted); font-size: 11px; margin-left: auto; }
  /* 时长按钮放标题行：不占内容高度，和清单模式的 ＋ 一个位置习惯 */
  .head-min {
    margin-left: auto; padding: 3px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font: inherit; font-size: 11.5px;
  }
  .head-min:active { background: var(--chip); color: var(--accent); }
  .head-min + .ver { margin-left: 6px; }

  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.32); display: none; z-index: 10; }
  .mask.on { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .18s ease-out;
  }
  .sheet.on { transform: translateY(0); }
  .sheet h2 { font-size: 13.5px; margin: 0 0 2px; font-weight: 600; }
  .sheet .sub { color: var(--muted); font-size: 11.5px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .pick {
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 0 7px;
    text-align: center; font-size: 12.5px; background: transparent;
    color: var(--fg); font-family: inherit;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  /* 每个档位直接把配好的休息时长写在下面：联动了什么，一眼能看见，
     不用点进去才发现"原来休息也跟着变" */
  .pick .b { font-size: 10px; color: var(--muted); }
  .pick.on .b { color: var(--accent); }
  .pick:active { background: var(--chip); }
  .pick.on { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--chip); }

  /* 临时提示用独立的浮层，不借用 #hint：
     页面每秒 refresh 一次，render() 会把 #hint 重置成"通知权限未开启"那类常驻提示，
     写在里面的临时提示活不过一秒。 */
  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
    /* max-content：不写的话收缩到"半个屏宽"就折行了 —— 22 个字的句子
       会被切成两截。配 max-width 兜住超长文本。 */
    width: max-content; max-width: 86%; padding: 7px 12px; border-radius: 999px;
    background: rgba(0,0,0,.82); color: #fff; font-size: 12px;
    text-align: center; opacity: 0; transition: opacity .18s;
    pointer-events: none; z-index: 12;
  }
  .toast.on { opacity: 1; }

  /* 圆环用 SVG：一条底环 + 一条进度环，靠 stroke-dashoffset 走，不用 canvas。 */
  .ring { position: relative; width: 236px; height: 236px; margin: 6px 0 2px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--accent); transition: stroke-dashoffset .35s linear; }
  .ring.run .bar { stroke: var(--focus); }
  .ring.rest .bar { stroke: var(--break); }
  .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .time { font-size: 46px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .phase { font-size: 12.5px; color: var(--muted); }
  .dots { display: flex; gap: 5px; margin-top: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--accent); }

  .actions { display: flex; gap: 8px; margin-top: 14px; width: 100%; max-width: 320px; }
  .btn {
    flex: 1; padding: 11px 0; border-radius: 11px; font: inherit; font-size: 13.5px;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
  }
  .btn.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .btn:active { background: var(--chip); }
  .btn:disabled { opacity: .45; }

  .stats {
    margin-top: 18px; width: 100%; max-width: 320px;
    display: flex; align-items: baseline; gap: 8px;
    color: var(--muted); font-size: 12px;
  }
  .records { width: 100%; max-width: 320px; margin-top: 6px; }
  .rec {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px;
  }
  .rec:last-child { border-bottom: none; }
  .rec .mode { color: var(--muted); font-size: 11.5px; width: 34px; flex: none; }
  .rec .when { margin-left: auto; color: var(--muted); font-size: 11px; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 14px; text-align: center; line-height: 1.6; }
  .warn { color: var(--focus); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>番茄钟</h1>
    <button class="head-min" id="durBtn" type="button">25 分钟</button>
    <span class="ver" id="ver"></span>
  </div>

  <div class="ring" id="ring">
    <svg width="236" height="236" viewBox="0 0 236 236">
      <circle class="track" cx="118" cy="118" r="104" fill="none" stroke-width="10"/>
      <circle class="bar" id="bar" cx="118" cy="118" r="104" fill="none" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="653.45" stroke-dashoffset="0"/>
    </svg>
    <div class="center">
      <div class="time" id="time">25:00</div>
      <div class="phase" id="phase">专注</div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="main">开始专注</button>
    <button class="btn" id="skip" disabled>跳过</button>
    <button class="btn" id="reset" disabled>重置</button>
  </div>

  <div class="stats">
    <span id="today">今天还没有记录</span>
  </div>
  <div class="records" id="records"></div>
  <div class="hint" id="hint"></div>
</div>

<div class="mask" id="durMask"></div>
<div class="sheet" id="durSheet">
  <h2>专注时长</h2>
  <p class="sub" id="durSub">休息时长随专注时长自动配置</p>
  <div class="grid" id="durGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // 番茄钟：**界面在插件里，计时和通知在主包**。
  //
  // 插件不自己 setTimeout 计时 —— 那样关掉页面就停、进程被杀就归零。
  // 这里只做三件事：读状态、画状态、把按钮点成 timer.* 调用。
  //
  // 到点事件由主包派发（pomodoro.sessionFinished），插件只负责落一条记录。
  // 落库前先按 session_id 查一次：事件可能因为补发而重复到达，重复插入会让
  // "今天专注几次"直接翻倍。

  var RING = 653.45; // 2πr，r=104
  var STATE = { session: null, poll: null, bridgeOk: true, focusMinutes: 25 };

  // 专注时长的预设：15~60，每 5 分钟一档。
  //
  // 为什么不是 5 起：成年人的高度专注区间是 10~40 分钟（光明网、科普中国、
  // 百度百科引的是同一组数据），25 分钟是其中最"跳一跳够得着"的位置。
  // 低于 10 分钟根本进不了状态 —— 5 分钟的"专注"没有实际意义，
  // 与其给一个用不上的档位，不如把范围收在真有人用的地方。
  // 上限 60：再长就该分两轮了，番茄钟的价值本来就在间歇。
  var PRESETS = [15, 20, 25, 30, 35, 40, 45, 50, 60];

  // 休息时长跟着专注走：短休按 5:1（和 25/5 这个经典比例同一套），
  // 取最近的 5 分钟档、下限 5；长休 = 短休 × 3。
  // 写成公式而不是一张对照表，是为了以后加档位不用重算。
  function breaksFor(focusMinutes) {
    var short = Math.max(5, Math.round(focusMinutes / 25) * 5);
    return { short: short, long: short * 3 };
  }

  function planParams(minutes) {
    var b = breaksFor(minutes);
    return {
      focusMinutes: minutes,
      shortBreakMinutes: b.short,
      longBreakMinutes: b.long,
    };
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mmss(seconds) {
    var s = Math.max(0, Math.round(seconds));
    return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  }
  function phaseName(mode) {
    return mode === 'short_break' ? '短休' : mode === 'long_break' ? '长休' : '专注';
  }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  // ---- 渲染 ----

  function render() {
    var s = STATE.session;
    var ring = document.getElementById('ring');
    var main = document.getElementById('main');
    var skip = document.getElementById('skip');
    var reset = document.getElementById('reset');

    if (!s) {
      document.getElementById('time').textContent = mmss(STATE.focusMinutes * 60);
      document.getElementById('phase').textContent = '专注';
      document.getElementById('bar').setAttribute('stroke-dashoffset', String(RING));
      ring.className = 'ring';
      main.textContent = '开始专注';
      skip.disabled = true;
      reset.disabled = true;
      renderDots(0, 'focus');
      return;
    }

    var isBreak = s.mode !== 'focus';
    document.getElementById('time').textContent = mmss(s.remainingSeconds);
    document.getElementById('phase').textContent =
      phaseName(s.mode) + (s.finished ? ' · 结束' : '');
    document.getElementById('bar').setAttribute(
      'stroke-dashoffset', String(RING * (1 - (s.progress || 0)))
    );
    ring.className = 'ring' + (s.finished ? '' : (isBreak ? ' rest' : ' run'));

    if (s.finished) {
      main.textContent = isBreak ? '结束休息' : '开始休息';
    } else if (s.running) {
      main.textContent = '暂停';
    } else {
      // 一秒没跑过就是"开始"，否则是"继续" —— 跳过之后进的是新一轮，
      // 显示"继续"会让人以为还能接着上一轮跑
      main.textContent = s.remainingSeconds === s.plannedSeconds ? '开始' : '继续';
    }
    skip.disabled = s.finished;
    reset.disabled = false;
    renderDots(s.round, s.mode);

    // 没有通知权限时说清楚，别让用户以为到点一定会响
    document.getElementById('hint').innerHTML = s.canNotify === false
      ? '<span class="warn">通知权限未开启</span><br>到点提醒不会显示。请在系统设置中允许「任务管家6」发送通知'
      : '';
  }

  // 四个点 = 这一组里已经完成几个专注。
  //
  // 关键在"什么时候清零"：第 4 个专注做完时四个点都亮着（这一组满了），
  // 长休期间保持满格；**进入下一轮专注时清零**，从头数。
  // 之前只看 round % 4，长休结束那一刻就掉了 3 个点，看起来像往回跳。
  function renderDots(round, phase) {
    var host = document.getElementById('dots');
    var done = ((round % 4) + 4) % 4;
    var groupFull = done === 0 && round > 0 && phase === 'long_break';
    var html = '';
    for (var i = 0; i < 4; i++) {
      var on = groupFull || i < done;
      html += '<span class="dot' + (on ? ' on' : '') + '"></span>';
    }
    host.innerHTML = html;
  }

  async function refresh() {
    try {
      STATE.session = await window.host.call('timer.state', {});
      render();
    } catch (error) {
      if (error && error.code === 'unavailable') {
        STATE.bridgeOk = false;
        document.getElementById('hint').innerHTML =
          '<span class="warn">当前版本不支持计时功能</span><br>需要 6.1.0 或更高版本';
      }
    }
  }

  async function refreshRecords() {
    // 记录**直接问主包**，不再自己攒表：事件只用来触发刷新。
    // 这么改是因为事件补发会被权限/时序/进程是否活着影响 ——
    // 杀进程那轮的记录曾经永远补不回来，而查询把这三件事一次绕开。
    var res = await window.host.call('timer.history', { limit: 100 });
    var rows = ((res && res.sessions) || []).filter(function (r) {
      // endedAt 是 UTC，必须按本地日期判断"今天"，否则跨时区会算错一天
      return localDayKey(r.endedAt) === todayKey();
    });

    var focus = rows.filter(function (r) { return r.mode === 'focus'; });
    var minutes = focus.reduce(function (sum, r) {
      return sum + Math.round((r.actualSeconds || 0) / 60);
    }, 0);
    document.getElementById('today').textContent = focus.length
      ? '今天 ' + focus.length + ' 次 · 共 ' + minutes + ' 分钟'
      : '今天还没有记录';

    var host = document.getElementById('records');
    host.innerHTML = rows.slice(0, 5).map(function (r) {
      var mins = Math.round((r.actualSeconds || 0) / 60);
      return '<div class="rec">' +
        '<span class="mode">' + phaseName(r.mode) + '</span>' +
        '<span>' + mins + ' 分钟</span>' +
        '<span class="when">' + localTime(r.endedAt) + '</span>' +
        '</div>';
    }).join('');
  }

  function localDayKey(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    // 格式必须和 todayKey() 完全一致，否则永远比不上
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function localTime(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // ---- 按钮 ----

  document.getElementById('main').addEventListener('click', async function () {
    var s = STATE.session;
    if (!s) {
      STATE.session = await window.host.call('timer.start', Object.assign(
        { mode: 'focus' }, planParams(STATE.focusMinutes)
      ));
      render();
      return;
    }
    if (s.finished) {
      // `timer.next` 一步到位：推进轮次（第 4 个专注后是长休）并立刻开跑。
      // 别自己算下一阶段 —— round 是主包的，插件算会两边对不上。
      await window.host.call('timer.next', {});
      await refresh();
      return;
    }
    if (s.running) {
      await window.host.call('timer.pause', {});
    } else if (s.remainingSeconds === s.plannedSeconds) {
      // 一秒没跑过 = 开始（重置之后、或者刚进下一个阶段）。
      // 调 resume 会复用上一个会话的 id，那一轮就记不进历史了。
      await window.host.call('timer.start', Object.assign(
        { mode: s.mode }, planParams(STATE.focusMinutes)
      ));
    } else {
      await window.host.call('timer.resume', {});
    }
    await refresh();
  });

  // ---- 专注时长 ----

  function renderDur() {
    document.getElementById('durBtn').textContent = STATE.focusMinutes + ' 分钟';
  }

  function renderDurGrid() {
    var host = document.getElementById('durGrid');
    host.innerHTML = PRESETS.map(function (m) {
      var on = m === STATE.focusMinutes ? ' on' : '';
      var b = breaksFor(m);
      return '<button class="pick' + on + '" data-min="' + m + '" type="button">' +
        '<span>' + m + ' 分</span>' +
        '<span class="b">休 ' + b.short + '</span>' +
        '</button>';
    }).join('');
    // 这里**不写具体分钟数**：运行中改过时长时，本轮实际生效的和所选的不一致，
    // 写在说明里就是错的。每个档位卡片上已经标了配套休息（「休 N」）。
    document.getElementById('durSub').textContent =
      '休息时长随专注时长自动配置。本轮开始后的修改于下一轮生效。';
  }

  function openDur() {
    renderDurGrid();
    document.getElementById('durMask').classList.add('on');
    document.getElementById('durSheet').classList.add('on');
  }

  function closeDur() {
    document.getElementById('durMask').classList.remove('on');
    document.getElementById('durSheet').classList.remove('on');
  }

  async function pickDur(minutes) {
    closeDur();
    if (minutes === STATE.focusMinutes) return;

    try {
      // 交给主包改计划。专注和休息**一起传**：只改专注会出现
      // 45 分钟配 5 分钟休息的错配。
      var res = await window.host.call('timer.configure', planParams(minutes));
      STATE.focusMinutes = minutes;
      renderDur();

      if (res && res.applied === 'next') {
        // 这一轮已经开始了：改动**留给下一轮**，本轮圆环不动。
        // 不这么做的话，中途改时长等于给这一轮凭空加减时间。
        var b = breaksFor(minutes);
        render();
        flashToast('已设为 ' + minutes + ' 分钟，短休 ' + b.short + ' 分钟，下一轮生效');
      } else {
        STATE.session = res && res.session ? res.session : STATE.session;
        render();
      }

      // 存自己的偏好：主包不管用户的节奏，下次打开由插件带回来
      window.host.call('store.set', { key: 'focusMinutes', value: String(minutes) })
        .catch(function () { /* 存不上不影响这一轮，下次回到 25 分钟而已 */ });
    } catch (error) {
      document.getElementById('hint').textContent = '设置失败：' + (error.message || error.code);
    }
  }

  // 临时提示：3.6 秒后撤掉。用独立浮层而不是 #hint —— #hint 每秒被 render()
  // 重置一次，写在里面的提示活不过一秒。时长按"读一遍 20 字的句子"估的。
  var toastTimer = null;
  function flashToast(text) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('on');
      toastTimer = null;
    }, 3600);
  }

  document.getElementById('durBtn').addEventListener('click', openDur);
  document.getElementById('durMask').addEventListener('click', closeDur);
  document.getElementById('durGrid').addEventListener('click', function (event) {
    var btn = event.target.closest('.pick');
    if (btn) pickDur(parseInt(btn.getAttribute('data-min'), 10));
  });

  document.getElementById('skip').addEventListener('click', async function () {
    await window.host.call('timer.skip', {});
    await refresh();
  });

  document.getElementById('reset').addEventListener('click', async function () {
    await window.host.call('timer.reset', {});
    await refresh();
  });

  // ---- 启动 ----

  function whenHostReady(callback, tries) {
    tries = tries || 0;
    if (window.host) return callback();
    if (tries > 100) {
      document.getElementById('hint').textContent = '无法连接应用，请重新打开';
      return;
    }
    setTimeout(function () { whenHostReady(callback, tries + 1); }, 30);
  }

  whenHostReady(async function () {
    try {
      var sys = await window.host.call('system.info', {});
      document.getElementById('ver').textContent = 'v' + sys.version;
    } catch (error) { /* 版本显示不出来不影响用 */ }

    // 页面没开着时结束的会话：记录已经由主包写进历史，这里只需要把事件清掉。
    // 不再靠事件「补数据」—— 那是权限和时序的雷区（6.1.0 踩过）。
    try {
      var pending = await window.host.call('event.pending', { limit: 50 });
      var acked = [];
      for (var i = 0; i < (pending || []).length; i++) {
        acked.push(pending[i].id);
      }
      if (acked.length) await window.host.call('event.ack', { ids: acked });
    } catch (error) {
      // 不静默：补发通道断了之后，"杀进程那轮的记录"就永远补不回来，
      // 而表面上一点错都看不出来（真踩过，查了很久）
      console.warn('[pomodoro] 读取待补发事件失败：', error);
    }

    window.host.on('pomodoro.sessionFinished', function () {
      // 事件只是「有变化了」的通知，数据去主包查
      refreshRecords();
    });

    // 读用户上次选的时长。读不到就用 25（主包默认）
    try {
      var saved = await window.host.call('store.get', { key: 'focusMinutes' });
      var minutes = parseInt(saved && saved.value, 10);
      // 只接受预设里的档位：老版本存过 5/10 的，这里会自动回到默认 25
      if (PRESETS.indexOf(minutes) >= 0) {
        STATE.focusMinutes = minutes;
      }
    } catch (error) { /* 读不到就用默认值 */ }
    renderDur();

    // 把偏好同步给主包。不同步的话：重启后主包 plan 回到默认 25，
    // 而头部按钮显示的是用户的 60 —— 点「跳过」推进出来的下一轮就是 25:00，
    // 和头上的 60 对不上（2026-11-02 在模拟器上看到过）。
    try {
      await window.host.call('timer.configure', planParams(STATE.focusMinutes));
    } catch (error) { /* 老主包没有 configure，退回默认节奏 */ }

    await refresh();
    await refreshRecords();

    // 每秒问一次状态：主包才是计时的真相，插件不自己扣秒
    STATE.poll = setInterval(refresh, 1000);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && window.host) {
      refresh();
      refreshRecords();
    }
  });
</script>
</body>
</html>
