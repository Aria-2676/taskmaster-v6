name: v5_app
description: "任务管家 V6 - 字段可配置、插件可扩的任务管理应用"
publish_to: 'none'

# versionCode 是 Android 覆盖安装的唯一判据（只比整数）。
# 6.0.0 必须严格大于 V5 发布包的 versionCode —— V5 最后一个包是 +0，
# 这里给 6000 留足余量，之后每次发版 +1。
version: 6.0.1+6001

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 本地数据
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # 状态与本地化
  provider: ^6.1.1
  intl: ^0.20.3

  # 插件运行时（WebView 整页 + 包解压校验）
  webview_flutter: ^4.14.1
  archive: ^4.2.0
  crypto: ^3.0.7
  convert: ^3.1.2

  # 自更新：查清单 → 多源下载 → 拉起系统安装器
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  open_filex: ^4.7.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^18.0.1
  share_plus: ^12.0.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1
  # 让真实 SQL 聚合能在宿主测试进程里跑（sqflite 的 ffi 实现）
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/plugins/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
